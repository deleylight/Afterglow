[package]
name = "afterglow"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "image-without-codecs", "thread-pool", "crisp"] }
image = { version = "0.25", default-features = false, features = ["jpeg","png"] }
quick-xml = { version = "0.42.0", features = ["serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
